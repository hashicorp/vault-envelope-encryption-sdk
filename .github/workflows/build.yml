name: build

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release/**'

permissions:
  contents: read

env:
  GOPRIVATE: github.com/hashicorp/*

jobs:
  build:
    runs-on: [ 'self-hosted', 'small', 'linux' ]
    env:
      TEST_RESULTS: "/tmp/test-results/gotestsum-report.xml"
    permissions:
      id-token: write # Note: this permission is explicitly required for Vault auth
      contents: read
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ".go-version"
          cache: true
      - run: go version

      - name: Install CI Tools
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: make bootstrap

      - name: Build & test
        env:
          GOPRIVATE: github.com/hashicorp/*
        run: |
          set -eux -o pipefail

          go build ./...

          go install gotest.tools/gotestsum@v1.9.0
          CGO_ENABLED=1 \
            gotestsum --format=short-verbose --junitfile "${TEST_RESULTS}" -- \
              -timeout=10m \
              -parallel=20 \
              ./...

      - name: Race test
        run: |
          make test-race

      - name: Run code coverage
        run: make cover

      - name: Archive code coverage results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-coverage
          path: coverage.txt

  publish_code_coverage:
    name: "Publish code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents:      read
      actions:       read
      pull-requests: write
    steps:
      - name: Publish code coverage report to PR
        continue-on-error: true
        uses: fgrosse/go-coverage-report@8c1d1a09864211d258937b1b1a5b849f7e4f2682 # v1.2.0