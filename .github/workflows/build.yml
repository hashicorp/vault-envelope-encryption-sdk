name: build

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release/**'

permissions:
  contents: read

env:
  GOPRIVATE: github.com/hashicorp/*

jobs:
  build:
    runs-on: [ 'self-hosted', 'small', 'linux' ]
    permissions:
      id-token: write # Note: this permission is explicitly required for Vault auth
      contents: read
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Authenticate to Vault
        id: vault-auth
        run: vault-auth

      - name: Fetch Secrets
        id: secrets
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # pin@v3.4.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: |
            kv/data/github/${{ github.repository }}/github-token token | elevated_github_token;

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ".go-version"
          cache: true
      - run: go version

      - name: Install CI Tools
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: make bootstrap

      - name: Build & test
        run: |
          set -eux -o pipefail
          git config --global url."https://${{ steps.secrets.outputs.elevated_github_token }}@github.com/".insteadOf "https://github.com/"

          make dev test

      - name: Race test
        run: |
          make test-race

      - name: Run code coverage
        run: make cover

      - name: Archive code coverage results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-coverage
          path: coverage.txt

  publish_code_coverage:
    name: "Publish code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents:      read
      actions:       read
      pull-requests: write
    steps:
      - name: Publish code coverage report to PR
        continue-on-error: true
        uses: fgrosse/go-coverage-report@8c1d1a09864211d258937b1b1a5b849f7e4f2682 # v1.2.0