name: build

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release/**'

permissions:
  contents: read

env:
  GOPRIVATE: github.com/hashicorp/*

jobs:
  go-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.go-version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: go-version
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: [ 'self-hosted', 'small', 'linux' ]
    env:
      TEST_RESULTS: "/tmp/test-results/gotestsum-report.xml"
    permissions:
      id-token: write # Note: this permission is explicitly required for Vault auth
      contents: read
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ".go-version"
          cache: true
      - run: go version

      - name: Install CI Tools
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: make bootstrap

      - name: Build
        env:
          GOPRIVATE: github.com/hashicorp/*
        run: |
          set -eux -o pipefail

          go build ./...

  acceptance:
    name: vault_image:${{ matrix.image }}
    needs: [ go-version ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "vault-enterprise:1.21.0-ent"
          - "vault-enterprise:latest"
    services:
      vault:
        image: hashicorp/${{ matrix.image }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
        options: >-
          --health-cmd "VAULT_ADDR=http://127.0.0.1:8200 vault status"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8200:8200

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ".go-version"
          cache: true
      - run: go version

      - name: Install CI Tools
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: make bootstrap

      - name: Acceptance Tests
        env:
          VAULT_TOKEN: "root"
          VAULT_ADDR: "http://localhost:8200"
          # RUNS_IN_CONTAINER is false if not using jobs.<job_id>.container
          RUNS_IN_CONTAINER: "false"
        run: |          
          make test